name: Deploy WebDJ to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/djay-layout-rebuild
    paths:
      - 'WebDJ/**'
      - '.github/workflows/webdj-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: WebDJ/package-lock.json

      - name: Install dependencies
        working-directory: WebDJ
        run: npm ci

      - name: Build app
        working-directory: WebDJ
        env:
          VITE_BASE_PATH: /LLMcoding/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: WebDJ/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
